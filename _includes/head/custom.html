<!-- Design v2 (P3-15) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">

<script>
/* One fixed appearance for every viewer: dark, LCARS amber, Chakra Petch. */
(function () {
  try {
    var d = document.documentElement;
    d.setAttribute('data-theme', 'dark');
    d.setAttribute('data-accent', 'lcars');
    d.setAttribute('data-type', 'chakra');
    d.classList.add('trek-more');
    localStorage.setItem('theme', 'dark');
    localStorage.removeItem('jk.accent');
    localStorage.removeItem('jk.type');
    localStorage.removeItem('jk.trek');
  } catch (e) {}
})();
</script>
