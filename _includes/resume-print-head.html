<!-- Print-only resume header. Invisible on screen (design.css hides it under
     @media screen); the print stylesheet lays it out at the top of the PDF.
     Keep the contact line in step with the resume body. -->
<div class="resume-print-head">
  <div class="resume-print-head__text">
    <h1 class="resume-print-head__name">Jim Kirk</h1>
    <p class="resume-print-head__role">Technology Executive</p>
    <p class="resume-print-head__contact">jimkirkns@outlook.com &middot; 902-482-6573 &middot; Halifax, Nova Scotia</p>
  </div>
  <div class="resume-print-head__photo">
    <img src="{{ '/images/profile.jpg' | relative_url }}" alt="Jim Kirk">
  </div>
</div>
